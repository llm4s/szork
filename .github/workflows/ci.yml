name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress; runs on main are never cancelled
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Cache Ivy2 and Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
          key: ${{ runner.os }}-ivy2-${{ hashFiles('**/build.sbt', 'project/**') }}
      - name: Check formatting, compile (warnings are errors) and test
        run: sbt -batch scalafmtCheckAll Test/compile test
      # A separate, instrumented run: it measures and never fails the build on a figure
      - name: Measure test coverage
        run: sbt -batch coverage test coverageReport
      - name: Keep the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/scala-*/scoverage-report/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
