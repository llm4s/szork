# llm4s configuration for szork (llm4s 0.5.x named provider sections).
#
# Each section below is a named provider. szork picks one at start-up:
#   - SZORK_LLM_PROVIDER=openai | anthropic | ollama (llama/local are aliases for ollama), or
#   - when unset, the first of openai / anthropic / ollama whose key (or LLAMA_BASE_URL) is present.
# SZORK_LLM_MODEL overrides the model of whichever section is used.
#
# Values may come from the environment or from a .env file in the project root
# (see .env.example); szork makes .env entries visible to these ${?VAR} bindings.
llm4s {
  providers {
    # The default section for tools that call Llm4sConfig.defaultProvider();
    # the szork server chooses its section as described above.
    provider = "openai"

    openai {
      provider = "openai"
      model    = "gpt-4o"
      model    = ${?SZORK_LLM_MODEL}
      apiKey   = ${?OPENAI_API_KEY}
      baseUrl  = ${?OPENAI_BASE_URL}
    }

    anthropic {
      provider = "anthropic"
      model    = "claude-sonnet-4-5"
      model    = ${?SZORK_LLM_MODEL}
      apiKey   = ${?ANTHROPIC_API_KEY}
      baseUrl  = ${?ANTHROPIC_BASE_URL}
    }

    # Local models through Ollama. The game uses tool calls, so pick a tool-capable model
    # (llama3.1, qwen2.5, ...); llama3:latest and llama2 do not support tools.
    ollama {
      provider = "ollama"
      model    = "llama3.1"
      model    = ${?SZORK_LLM_MODEL}
      baseUrl  = "http://localhost:11434"
      baseUrl  = ${?LLAMA_BASE_URL}
    }
  }
}
