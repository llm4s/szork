# The language models Szork can play on, as llm4s named provider sections (read through Llm4sConfig).
#
# Each section is one choice of SZORK_LLM_PROVIDER, with the model used when SZORK_LLM_MODEL is not set.
# Szork picks the section and fills in the key, model and base URL from its own settings (.env or the
# environment: see the README's table), so nothing here reads an environment variable.

llm4s {
  providers {
    # gpt-6-luna plays a whole adventure. OpenAI's Chat Completions API, which llm4s uses, lets its current
    # models call tools only with reasoning off, and llm4s 1.0.0 arranges that for this model (it refuses
    # gpt-6.1-terra and does not arrange it for the gpt-5.6 models).
    openai {
      provider = "openai"
      model = "gpt-6-luna"
    }

    # Claude Sonnet 5.5 plays a whole adventure at Szork's default reasoning effort (low). Run a playtest on
    # a model before making it the default.
    anthropic {
      provider = "anthropic"
      model = "claude-sonnet-5-5"
    }

    # A local server with an OpenAI-compatible API (Ollama, llama.cpp): LLAMA_BASE_URL replaces the URL.
    llama {
      provider = "openai"
      model = "llama3"
      baseUrl = "http://localhost:11434/v1"
      apiKey = "sk-no-key-required"
    }
  }
}
